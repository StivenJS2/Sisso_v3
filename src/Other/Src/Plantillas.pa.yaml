Screens:
  Plantillas:
    Properties:
      Fill: =RGBA(245, 247, 250, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =ClearCollect(colImagenes;
            {id: 1; img: SampleImage};
            {id: 2; img: SampleImage};
            {id: 3; img: SampleImage}
        );
        Set(varIndice; 1)
    Children:
      - CarruselContainer:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Height: =520
            Width: =840
            X: =40
            Y: =40
          Children:
            - TarjetaFondo:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(220, 225, 235, 1)
                  BorderThickness: =1
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =520
                  Width: =840
            - ImgActual:
                Control: Image@2.2.3
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Height: =460
                  Image: =Index(colImagenes; varIndice).img
                  ImagePosition: =ImagePosition.Fill
                  RadiusTopLeft: =16
                  RadiusTopRight: =16
                  Width: =840
            - BarraIndicadores:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =58
                  Width: =840
                  Y: =462
            - GradientOverlayLeft:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =RGBA(0, 0, 0, 0.15)
                  Height: =460
                  Width: =120
            - GradientOverlayRight:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =RGBA(0, 0, 0, 0.15)
                  Height: =460
                  Width: =120
                  X: =720
            - BtnAnterior:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  BorderThickness: =0
                  Color: =RGBA(30, 30, 30, 1)
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =RGBA(255, 255, 255, 0.85)
                  Font: =Font.'Open Sans'
                  Height: =48
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =RGBA(255, 255, 255, 1)
                  OnSelect: =Set(varIndice; If(varIndice = 1; CountRows(colImagenes); varIndice - 1))
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  RadiusBottomLeft: =24
                  RadiusBottomRight: =24
                  RadiusTopLeft: =24
                  RadiusTopRight: =24
                  Size: =18
                  Text: ="◀"
                  Width: =48
                  X: =16
                  Y: =205
            - BtnSiguiente:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  BorderThickness: =0
                  Color: =RGBA(30, 30, 30, 1)
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =RGBA(255, 255, 255, 0.85)
                  Font: =Font.'Open Sans'
                  Height: =48
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =RGBA(255, 255, 255, 1)
                  OnSelect: =Set(varIndice; If(varIndice = CountRows(colImagenes); 1; varIndice + 1))
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  RadiusBottomLeft: =24
                  RadiusBottomRight: =24
                  RadiusTopLeft: =24
                  RadiusTopRight: =24
                  Size: =18
                  Text: ="▶"
                  Width: =48
                  X: =776
                  Y: =205
            - TimerCarrusel:
                Control: Timer@2.1.0
                Properties:
                  Align: =%Align.RESERVED%.Center
                  AutoStart: =true
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =ColorFade(Self.BorderColor, 70%)
                  DisabledColor: =ColorFade(Self.Fill, 90%)
                  DisabledFill: =ColorFade(Self.Fill, 70%)
                  DisplayMode: =%DisplayMode.RESERVED%.Edit
                  Duration: =4000
                  Fill: =RGBA(56, 96, 178, 1)
                  Font: =Font.'Open Sans'
                  Height: =10
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                  OnTimerEnd: =Set(varIndice; If(varIndice = CountRows(colImagenes); 1; varIndice + 1))
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  Repeat: =true
                  VerticalAlign: =%VerticalAlign.RESERVED%.Middle
                  Visible: =false
                  Width: =10
            - GalIndicadores:
                Control: Gallery@2.15.0
                Variant: Horizontal
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  DelayItemLoading: =false
                  Height: =24
                  Items: =colImagenes
                  LoadingSpinner: =LoadingSpinner.None
                  ShowScrollbar: =false
                  TemplateSize: =32
                  Width: =120
                  X: =360
                  Y: =474
                Children:
                  - CirculoIndicador:
                      Control: Circle@2.3.0
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Fill: |-
                          =If(
                              ThisItem.id = varIndice;
                              RGBA(50, 100, 220, 1);
                              RGBA(200, 210, 230, 1)
                          )
                        Height: =14
                        Width: =14
                        X: =8
                        Y: =5
            - LblContador:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(130, 140, 165, 1)
                  Font: =Font.'Open Sans'
                  Height: =24
                  Size: =11
                  Text: =Text(varIndice) & " / " & Text(CountRows(colImagenes))
                  Width: =60
                  X: =710
                  Y: =474
